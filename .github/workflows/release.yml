name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w" -o driftnet2 ./cmd/driftnet2
      - name: Package
        run: |
          tar -czf "driftnet2-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" driftnet2 LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: driftnet2-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "driftnet2-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
